<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cockpit</title>
<meta name="description" content="Ma journée, mes tâches, mes objectifs et mes idées sur un seul écran.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECEFF3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : en-tête, barre « Noter » toujours visible, onglets (Aujourd'hui, Semaine, Thèmes, À trier) ; chaque thème a son tableau de bord. Trois colonnes sur iPad horizontal, deux en vertical, une sur téléphone. */
:root{
  color-scheme:light;
  --bg:#ECEFF3; --panel:#FFFFFF; --sunk:#F3F5F8; --ink:#131B25; --muted:#5A6777; --line:#D6DCE3;
  --accent:#2350D0; --accent-soft:#E2E8FB; --on-accent:#FFFFFF;
  --late:#C0342A; --late-soft:#FBE7E5; --on-late:#FFFFFF; --ok:#1B8455;
  --shadow:0 1px 2px rgba(19,27,37,.12); --shadow-lg:0 18px 50px rgba(19,27,37,.25); --scrim:rgba(19,27,37,.38);
  --c-blue:#3451D3; --c-blue-soft:#E4E9FE;
  --c-teal:#08806F; --c-teal-soft:#DAF2EE;
  --c-amber:#A2650E; --c-amber-soft:#F9EED7;
  --c-pink:#AD3D72; --c-pink-soft:#F8E2EC;
  --c-violet:#6B46C1; --c-violet-soft:#EEE8FB;
  --c-slate:#4A5A6C; --c-slate-soft:#E6EBF0;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1218; --panel:#151C25; --sunk:#1B242F; --ink:#E4E9EF; --muted:#94A1B0; --line:#29333F;
    --accent:#7D9BFF; --accent-soft:#1D294B; --on-accent:#0A1022;
    --late:#FF7D71; --late-soft:#3A1E1C; --on-late:#2A0E0B; --ok:#52C58E;
    --shadow:0 1px 2px rgba(0,0,0,.5); --shadow-lg:0 18px 50px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.55);
    --c-blue:#94A9FF; --c-blue-soft:#1E2748; --c-teal:#55D3C1; --c-teal-soft:#10302B;
    --c-amber:#EEB65C; --c-amber-soft:#33280F; --c-pink:#F293C1; --c-pink-soft:#3A1B2B;
    --c-violet:#B9A2FF; --c-violet-soft:#2A2147; --c-slate:#A9B6C4; --c-slate-soft:#232D38;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1218; --panel:#151C25; --sunk:#1B242F; --ink:#E4E9EF; --muted:#94A1B0; --line:#29333F;
  --accent:#7D9BFF; --accent-soft:#1D294B; --on-accent:#0A1022;
  --late:#FF7D71; --late-soft:#3A1E1C; --on-late:#2A0E0B; --ok:#52C58E;
  --shadow:0 1px 2px rgba(0,0,0,.5); --shadow-lg:0 18px 50px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.55);
  --c-blue:#94A9FF; --c-blue-soft:#1E2748; --c-teal:#55D3C1; --c-teal-soft:#10302B;
  --c-amber:#EEB65C; --c-amber-soft:#33280F; --c-pink:#F293C1; --c-pink-soft:#3A1B2B;
  --c-violet:#B9A2FF; --c-violet-soft:#2A2147; --c-slate:#A9B6C4; --c-slate-soft:#232D38;
  color-scheme:dark;
}
.k-blue{--k:var(--c-blue);--k-soft:var(--c-blue-soft)} .k-teal{--k:var(--c-teal);--k-soft:var(--c-teal-soft)}
.k-amber{--k:var(--c-amber);--k-soft:var(--c-amber-soft)} .k-pink{--k:var(--c-pink);--k-soft:var(--c-pink-soft)}
.k-violet{--k:var(--c-violet);--k-soft:var(--c-violet-soft)} .k-slate{--k:var(--c-slate);--k-soft:var(--c-slate-soft)}

*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,textarea,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(28px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.ico{display:inline-grid;place-items:center}
.ico svg{width:100%;height:100%}

/* En-tête */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.eyebrow{margin:0 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.badge{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:12px;font-weight:600;color:var(--c-amber);background:var(--c-amber-soft);padding:2px 9px;border-radius:999px;border:0}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4.2vw,46px);line-height:1.04;letter-spacing:-.015em;text-wrap:balance}
.clockbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clock{font-family:var(--f-mono);font-weight:500;font-size:clamp(32px,4.8vw,54px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin-left:4px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;color:var(--muted);min-height:36px}
.ghost[aria-pressed="true"]{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:inline-grid;place-items:center;color:var(--muted);padding:0;flex:none}
.icon-btn .ico{width:20px;height:20px}
.icon-btn.small{width:32px;height:32px;border-radius:9px}
.icon-btn.small .ico{width:16px;height:16px}

/* Noter */
.capture{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.cap-label{flex:none;padding-top:10px;font-family:var(--f-display);font-weight:700;font-size:16px}
#noteInput{flex:1 1 260px;min-width:0;resize:none;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:16px;line-height:1.4;min-height:44px;max-height:140px}
#noteInput::placeholder{color:var(--muted)}
.primary{border:0;background:var(--accent);color:var(--on-accent);font-weight:600;border-radius:10px;padding:11px 16px;white-space:nowrap;min-height:44px}
.primary.small{min-height:36px;padding:7px 12px;font-size:13.5px}
.capture .primary{flex:none}

/* Onglets et domaines */
.controls{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.tabs{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.count{min-width:20px;padding:0 6px;border-radius:999px;background:var(--late);color:var(--on-late);font-size:11.5px;line-height:18px;font-weight:700;text-align:center}
.count:empty{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500;min-height:34px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;background:var(--k,var(--muted))}

/* Panneaux */
main{display:block}
.view{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;min-width:0}
h2{margin:0 0 10px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.005em;display:flex;align-items:center;justify-content:space-between;gap:8px}
h2 small{font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.04em}
.col-horizon h2:not(:first-child){margin-top:18px}
.add{border:0;background:var(--accent-soft);color:var(--accent);font-family:var(--f-body);font-weight:700;font-size:13px;border-radius:999px;padding:6px 12px;min-height:32px;white-space:nowrap}
.linkish{border:0;background:transparent;color:var(--accent);font-family:var(--f-body);font-weight:600;font-size:13px;padding:4px 0}
.grid-jour{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
.empty{color:var(--muted);font-size:14px;margin:4px 0}
.hint{color:var(--muted);font-size:13px;margin:0}
.tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;white-space:nowrap;font-weight:500}
.empty-state{color:var(--muted)}
.empty-state strong{color:var(--ink)}

/* Chronogramme */
.chrono{padding:12px 16px 10px}
.chrono-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px 12px;flex-wrap:wrap;margin-bottom:8px}
.chrono-head strong{font-family:var(--f-display);font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.free{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{position:relative;height:46px;background:var(--sunk);border-radius:10px;overflow:hidden}
.blk{position:absolute;top:5px;bottom:5px;border-radius:7px;padding:5px 7px;font-size:12px;font-weight:600;line-height:1.25;overflow:hidden;white-space:nowrap;background:var(--k-soft);color:var(--k)}
.blk span{display:block;overflow:hidden;text-overflow:ellipsis}
.blk.past{opacity:.45} .blk.dim{opacity:.22}
.now{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--late)}
.now::before{content:"";position:absolute;top:0;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--late)}
.ticks{position:relative;height:16px;margin-top:5px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}

/* Journée */
.next{background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.next .k{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.next .v{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.2;margin-top:2px}
.next .s{font-size:13px;color:var(--muted);margin-top:2px}
.allday{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pill{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--k-soft);color:var(--k)}
.agenda{list-style:none;margin:0;padding:0}
.agenda li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.agenda li:first-child{border-top:0}
.agenda .time{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
.agenda .ev{display:flex;align-items:flex-start;gap:8px;min-width:0}
.agenda .ev .dot{margin-top:6px}
.agenda li.past{opacity:.5}
.agenda li.current .time{color:var(--accent);font-weight:600}
.agenda li.current .ev{font-weight:600}

/* Tâches */
.group + .group{margin-top:12px}
.group-h{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.group-h .n{font-variant-numeric:tabular-nums;background:var(--sunk);border-radius:6px;padding:0 6px}
.group.g-late .group-h{color:var(--late)}
.group.g-late .group-h .n{background:var(--late-soft)}
.tasks{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:flex-start;gap:11px;padding:9px 6px;margin:0 -6px;border-top:1px solid var(--line);border-radius:8px}
.tasks .task:first-child{border-top:0}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:transparent;margin-top:1px;display:grid;place-items:center;padding:0;color:var(--panel);transition:background .15s,border-color .15s}
.check:hover{border-color:var(--accent)}
.check svg{width:12px;height:12px;opacity:0;transition:opacity .15s}
.done .check{background:var(--ok);border-color:var(--ok)}
.done .check svg{opacity:1}
.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-open{flex:1;min-width:0;display:flex;align-items:flex-start;gap:10px;text-align:left;border:0;background:transparent;padding:0;color:inherit}
.t-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.t-title{font-weight:500;overflow-wrap:anywhere}
.t-meta{display:flex;gap:5px 8px;flex-wrap:wrap;align-items:center}
.t-meta:empty{display:none}
/* Échéance en gros à droite : la date, puis le délai (retard, aujourd'hui, demain, J-n) */
.t-due{flex:none;display:flex;flex-direction:column;align-items:flex-end;text-align:right;line-height:1.15;padding-top:1px}
.t-due .d1{font-family:var(--f-display);font-weight:700;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.t-due .d2{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap;margin-top:2px}
.t-due.late .d1,.t-due.late .d2{color:var(--late)}
.t-due.late .d2,.t-due.today .d2{font-weight:600}
.t-due.today .d2{color:var(--accent)}
.has-notes{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.has-notes .ico{width:13px;height:13px}
/* Poignée pour changer l'ordre (glisser, ou flèches haut et bas au clavier) */
.grip{flex:none;align-self:stretch;width:26px;margin:-9px -6px -9px -4px;padding:0;border:0;background:transparent;color:var(--muted);opacity:.6;display:grid;place-items:center;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border-radius:8px}
.grip svg{width:15px;height:15px}
.grip:hover{opacity:1}
.tasks > .task:only-child .grip{visibility:hidden}
.task.dragging{position:relative;z-index:5;background:var(--panel);box-shadow:var(--shadow-lg)}
.task.dragging .grip{opacity:1;color:var(--accent);cursor:grabbing}
.tasks.sorting .task:not(.dragging){transition:transform .15s ease}
body.is-dragging{-webkit-user-select:none;user-select:none;cursor:grabbing}
.notes-in{min-height:120px}
/* Temps passé (mémoire des heures) */
.spent{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.spent .ico{width:13px;height:13px}
.time-box{display:flex;flex-direction:column;gap:8px}
.time-total{margin:0;font-family:var(--f-display);font-weight:700;font-size:17px}
.time-total.none{font-family:var(--f-body);font-weight:400;font-size:14px;color:var(--muted)}
.time-log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.time-log li{display:flex;align-items:center;gap:10px;padding:4px 4px 4px 12px;font-size:14px;min-height:40px}
.time-log li + li{border-top:1px solid var(--line)}
.time-log .tl-d{flex:1;min-width:0}
.time-log .tl-m{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.time-log .tl-s{color:var(--muted);font-size:12.5px}
.time-log .tl-x{flex:none;width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:0}
.time-log .tl-x:hover{background:var(--late-soft);color:var(--late)}
.time-add{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
/* Mode focus : plein écran, aucun temps affiché pendant */
.focus-go{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:9px 14px;font-size:15px;font-weight:600;min-height:44px}
.focus-go .ico{width:17px;height:17px}
body.focus-open{overflow:hidden}
.focus{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:max(20px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.focus[hidden]{display:none}
.focus-in{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px}
.focus-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.focus-top .ghost{margin-left:auto}
.focus-state{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;animation:pulse 2.4s ease-in-out infinite}
.focus.paused .pulse,.focus-pill.paused .pulse{background:var(--muted);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.focus-title{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(30px,5vw,52px);line-height:1.05;letter-spacing:-.015em;overflow-wrap:anywhere}
.focus-notes{flex:1;display:flex;flex-direction:column;gap:6px}
.focus-notes .lab{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.focus-notes textarea{flex:1;min-height:220px}
.focus-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.focus-actions button{min-height:48px;font-size:15px}
.focus-actions button:disabled{opacity:.7;cursor:default}
.focus-end{justify-content:center}
.focus-lead{margin:0;font-size:18px;color:var(--muted)}
.focus-big{font-family:var(--f-mono);font-weight:500;font-size:clamp(54px,10vw,96px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:0}
.focus-on{margin:0;font-size:18px;font-weight:600;overflow-wrap:anywhere}
.focus-pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:inline-flex;align-items:center;gap:9px;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:11px 18px;font-weight:600;font-size:14px;box-shadow:var(--shadow-lg)}
.focus-pill[hidden]{display:none}
.focus-pill .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slot-row .in{flex:1 1 150px;width:auto}
/* Agenda : grille horaire, tâches posées dans les créneaux */
.ag{display:flex;flex-direction:column;gap:12px}
.ag-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ag-bar h2{margin:0;flex:1 1 auto;font-size:19px}
.ag-nav{display:inline-flex;gap:6px;align-items:center}
.icon-btn.flip svg{transform:scaleX(-1)}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--muted);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.ag-place{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 10px;border:1px dashed var(--line);border-radius:12px;background:var(--sunk);transition:background .15s,border-color .15s}
.ag-place.drop{border-color:var(--late);background:var(--late-soft)}
.ag-place .lbl{font-family:var(--f-display);font-weight:700;font-size:15px;margin-right:2px}
.ag-place .hint{flex-basis:100%}
.ag-chip{display:inline-flex;align-items:center;gap:7px;max-width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-left:3px solid var(--k);border-radius:8px;padding:6px 10px 6px 6px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab;text-align:left;min-height:36px}
.ag-chip .ico{width:14px;height:14px;color:var(--muted);flex:none}
.ag-chip .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.ag-chip small{font-family:var(--f-mono);font-weight:500;color:var(--muted);font-size:11px}
.ag-chip.lifting{opacity:.35}
.ag-float{position:fixed;left:0;top:0;z-index:70;pointer-events:none;box-shadow:var(--shadow-lg)}
.ag-more{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13px;padding:6px 4px}
.ag-empty{color:var(--muted);font-size:13.5px}
.ag-wrap{overflow-x:auto}
.ag-grid{display:grid;grid-template-columns:40px repeat(var(--cols),minmax(0,1fr))}
.ag-grid.week{min-width:640px}
.ag-dh{border:0;background:transparent;padding:2px 0 8px;font-size:12.5px;color:var(--muted);display:flex;justify-content:center;align-items:baseline;gap:5px;min-width:0}
.ag-dh b{font-family:var(--f-display);font-size:17px;color:var(--ink);font-weight:700}
.ag-dh.today b{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:0 8px}
.ag-gut{position:relative}
.ag-gut span{position:absolute;right:6px;transform:translateY(-50%);font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.ag-gut span:first-child{transform:none}
.ag-col{position:relative;min-width:0;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--agh))}
.ag-col.we{background-color:var(--sunk)}
.ag-col.today{background-color:var(--accent-soft);background-color:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.ag-b{position:absolute;left:calc(var(--l) * 100% / var(--n) + 2px);width:calc(100% / var(--n) - 4px);display:flex;align-items:flex-start;gap:2px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--k);border-radius:7px;box-shadow:var(--shadow);overflow:hidden;font-size:12px;line-height:1.2;z-index:1}
.ag-b.done{opacity:.62}
.ag-ev{position:absolute;left:calc(var(--l) * 100% / var(--n) + 2px);width:calc(100% / var(--n) - 4px);display:flex;flex-direction:column;align-items:stretch;gap:1px;text-align:left;background:var(--k-soft);color:var(--ink);border:0;border-left:3px solid var(--k);border-radius:7px;padding:3px 5px;overflow:hidden;font-size:12px;line-height:1.2;font-family:inherit}
.ag-ev .hm{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.ag-ev .tt{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.ag-ev .lieu{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-ev.mid .tt,.ag-ev.short .tt{display:block;white-space:nowrap;text-overflow:ellipsis}
.ag-ev.short{padding-top:1px;padding-bottom:1px}
.ag-ev.short .hm{display:none}
.ag-ad{display:flex;flex-direction:column;gap:3px;padding:0 2px 6px;min-width:0}
.ag-ad .pill{display:block;border:0;font-size:11.5px;padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;font-family:inherit}
.ag-stale{margin:0}
.allday button.pill{border:0;font-family:inherit;cursor:pointer}
.evlink{border:0;background:transparent;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.evlink small{color:var(--muted);font-weight:400}
.ag-b.lifting{opacity:.3}
.ag-b .check{width:16px;height:16px;border-width:2px;margin:3px 0 0;flex:none}
.ag-b .check svg{width:9px;height:9px}
.ag-b.short .check{width:14px;height:14px;margin-top:1px}
.ag-grip{flex:none;align-self:stretch;width:15px;border:0;padding:0;background:transparent;color:var(--muted);display:grid;place-items:center;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
.ag-grip svg{width:11px;height:11px}
.ag-open{flex:1;min-width:0;align-self:stretch;border:0;background:transparent;padding:3px 4px 3px 3px;text-align:left;color:inherit;display:flex;flex-direction:column;gap:1px;overflow:hidden}
.ag-open .tt{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.ag-open .hm{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.ag-b.mid .ag-open{padding-top:2px;padding-bottom:2px}
.ag-b.mid .tt{display:block;white-space:nowrap;text-overflow:ellipsis}
.ag-b.done .tt{color:var(--muted);text-decoration:line-through}
.ag-b.short .ag-open{padding-top:1px;padding-bottom:1px}
.ag-b.short .tt{display:block;white-space:nowrap;text-overflow:ellipsis}
.ag-b.short .hm{display:none}
.ag-resize{position:absolute;left:15px;right:0;bottom:0;height:10px;cursor:ns-resize;touch-action:none;-webkit-user-select:none;user-select:none}
.ag-resize::after{content:"";position:absolute;left:50%;bottom:3px;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:var(--line)}
.ag-b.short .ag-resize{height:6px}
.ag-b.short .ag-resize::after,.ag-b.mid .ag-resize::after{display:none}
@media (max-width:900px){ .ag-grid.week .ag-b .check{display:none} }
.ag-ghost{position:absolute;left:2px;right:2px;border:2px dashed var(--accent);border-radius:7px;background:var(--accent-soft);font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--accent);padding:2px 6px;z-index:3;pointer-events:none}
.ag-now{position:absolute;left:0;right:0;height:2px;background:var(--late);z-index:2;pointer-events:none}
.ag-now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--late)}
.ag-now[hidden]{display:none}
/* Répartition de la semaine */
.rp{margin-top:14px}
.rp-sum{margin:0 0 12px;font-size:15px}
.rp-sum b{font-family:var(--f-display);font-size:18px}
.rp-sum small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.rp-legend{display:flex;gap:6px 16px;flex-wrap:wrap;margin:0 0 12px;padding:0;list-style:none;font-size:13.5px}
.rp-legend li{display:flex;align-items:center;gap:7px}
.rp-legend .v{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.rp-chart{display:flex;gap:6px;max-width:620px}
.rp-col{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.rp-plot{height:124px;width:100%;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid var(--line)}
.rp-stack{width:28px;display:flex;flex-direction:column-reverse;gap:2px;border-radius:4px 4px 0 0;overflow:hidden}
.rp-stack i{display:block;background:var(--k);flex:none}
.rp-col .d{font-size:12.5px;font-weight:600;margin-top:6px}
.rp-col.today .d{color:var(--accent)}
.rp-col .v{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.t-obj{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.dchip{border-radius:999px;padding:1px 9px;font-weight:600;font-size:12px;line-height:1.6;background:var(--k-soft,var(--sunk));color:var(--k,var(--muted));white-space:nowrap}
.due,.dur{color:var(--muted);font-family:var(--f-mono);font-size:12px}
.due.late{color:var(--late);font-weight:600}
.due.today{color:var(--accent);font-weight:600}
.task.fresh{animation:flash 2s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13.5px;padding:8px 0 0;text-align:left}
.tk{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;line-height:1.3}
.tk .check{width:18px;height:18px;border-width:2px;margin-top:0}
.tk .check svg{width:10px;height:10px}
.tk .t-open{gap:0}

/* À trier (aperçu), objectifs (aperçu), échéances */
.mini-notes{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
.mini-notes li{background:var(--sunk);border-radius:8px;padding:6px 9px;font-size:13.5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.gm{display:flex;flex-direction:column;gap:12px}
.gm .row{display:block;width:100%;text-align:left;border:0;background:transparent;padding:0}
.lbl{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ttl{font-weight:500;font-size:14px;overflow-wrap:anywhere}
.val{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--k,var(--accent))}
.bar.big{height:10px}
.dl{list-style:none;margin:0;padding:0}
.dl li{display:grid;grid-template-columns:50px minmax(0,1fr);gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.dl li:first-child{border-top:0}
.jx{font-family:var(--f-mono);font-weight:600;font-size:14px;text-align:center;border-radius:8px;padding:5px 0;background:var(--sunk);font-variant-numeric:tabular-nums}
.jx.soon{background:var(--late-soft);color:var(--late)}
.what{display:flex;flex-direction:column;min-width:0}
.what span:first-child{font-weight:500;overflow-wrap:anywhere}
.what span:last-child{font-size:12.5px;color:var(--muted)}

/* À trier */
.notes{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.note{background:var(--sunk);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.note-text{margin:0;font-size:16px;font-weight:500;overflow-wrap:anywhere;white-space:pre-wrap}
.note-meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12.5px;color:var(--muted)}
.note-actions{display:flex;flex-wrap:wrap;gap:8px}
.act{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;min-height:40px}
.act.small{padding:5px 10px;font-size:13px;min-height:32px}
.danger{border:1px solid var(--late);background:transparent;color:var(--late);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;min-height:40px}
.danger.armed{background:var(--late);color:var(--on-late)}

/* Thèmes : vue d'ensemble */
.dsec{display:flex;flex-direction:column;gap:10px}
.dsec + .dsec{margin-top:10px}
.dsec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dsec-h h2{margin:0;font-size:20px}
.gh{display:inline-flex;align-items:center;gap:8px}
.gh .dot{width:11px;height:11px}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.tcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;min-height:124px;min-width:0}
.tcard:hover{border-color:var(--k)}
.tcard-name{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.2;display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
.tcard-name .dot{width:10px;height:10px}
.tcard.loose .tcard-name{color:var(--muted)}
.tcard-meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tcard-next{font-size:13px;overflow-wrap:anywhere}
.tcard .tprog{margin-top:auto;display:flex;align-items:center;gap:8px}
.tcard .tprog .bar{flex:1;margin:0}

/* Thèmes : tableau de bord d'un thème */
.dash-head{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:22px;flex-wrap:wrap;min-width:0}
.crumb .sep{color:var(--muted);font-weight:500}
.crumb .dom{color:var(--k)}
.dash-actions{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}
.dash-col{display:flex;flex-direction:column;gap:14px;min-width:0}

/* Objectifs */
.ocard{display:flex;flex-direction:column;gap:8px}
.ocard-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ocard-h .icon-btn{margin-left:auto}
.odue{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.otitle{margin:0;font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.2;text-wrap:balance;overflow-wrap:anywhere}
.oprog{display:flex;align-items:center;gap:10px}
.oprog .bar{flex:1;margin:0}
.donelist .task{opacity:.7}

/* Idées */
.view-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.vh{margin:0;font-size:22px;justify-content:flex-start;gap:10px}
.igroups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px;align-items:start}
.isub{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--k,var(--muted));margin:14px 0 0}
.isub:first-of-type{margin-top:2px}
.ideas{list-style:none;margin:0;padding:0}
.idea{display:flex;align-items:center;gap:8px 10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.idea:first-child{border-top:0}
.idea-text{flex:1 1 200px;min-width:0;text-align:left;border:0;background:transparent;padding:4px 0;font-weight:500;overflow-wrap:anywhere;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.idea-actions{display:flex;gap:6px}

/* Semaine */

/* Fenêtres */
dialog.sheet{border:0;padding:0;border-radius:18px;width:min(580px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--panel);color:var(--ink);box-shadow:var(--shadow-lg)}
dialog.sheet::backdrop{background:var(--scrim)}
.sheet-body{padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;max-height:calc(100dvh - 24px);overflow:auto}
.sheet-title{margin:0;font-family:var(--f-display);font-size:20px;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field > .lab{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.in{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:16px;line-height:1.4;color:var(--ink);font-family:inherit}
textarea.in{resize:vertical;min-height:48px}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choice{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500;min-height:38px}
.choice[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.choice.dchoice{background:var(--k-soft);color:var(--k);border-color:transparent;font-weight:600}
.choice.dchoice[aria-pressed="true"]{background:var(--k);color:var(--panel);border-color:var(--k)}
.err{color:var(--late);font-size:13px;margin:0}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:4px}
.sheet-actions .spacer{flex:1}
.domblock{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.domblock:first-child{border-top:0;padding-top:2px}
.setrow{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
.setrow .in{flex:1 1 160px;width:auto;padding:8px 10px}
.in.mono{font-family:var(--f-mono);font-size:13px;min-width:0}
.calmap{display:flex;flex-direction:column;gap:6px;padding:8px 0 2px;border-top:1px solid var(--line)}
.calmap .calname{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.extp{margin:0;font-size:15px}
.agkey{display:flex;flex-direction:column;gap:6px}
.themelist{display:flex;flex-direction:column;gap:6px;padding-left:18px;border-left:2px solid var(--line);margin-left:12px}
.throw{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.throw .in{flex:1 1 150px;width:auto;padding:6px 10px;font-size:15px}
.throw .danger{min-height:34px;padding:4px 10px;font-size:13px}
.swatches{display:flex;gap:6px}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;background:var(--k);padding:0}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--panel)}

.sync{white-space:nowrap}
.sync.ok{color:var(--ok)}
.sync.warn{color:var(--late);border-color:var(--late)}
.loginform{display:flex;flex-direction:column;gap:8px}

.foot{margin:0;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.foot .danger{min-height:32px;padding:4px 10px;font-size:12.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));max-width:min(560px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:var(--shadow);z-index:60}

@media (max-width:1000px){
  .grid-jour{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"tasks day" "tasks horizon"}
  .col-tasks{grid-area:tasks} .col-day{grid-area:day} .col-horizon{grid-area:horizon}
}
@media (max-width:860px){
  .dash-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .grid-jour{grid-template-columns:minmax(0,1fr);grid-template-areas:"tasks" "horizon" "day"}
  .cap-label{flex-basis:100%;padding-top:0}
  .capture .primary{flex:1 1 100%}
  .tabs{display:flex;width:100%}
  .dash-actions{margin-left:0}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="when">
      <p class="eyebrow"><span>Cockpit</span><span aria-hidden="true">·</span><span id="weekLabel">Semaine</span><button type="button" class="badge" id="exBadge" data-act="settings" hidden>Exemples affichés</button></p>
      <h1 id="dateLabel">Aujourd'hui</h1>
    </div>
    <div class="clockbox">
      <button type="button" id="syncBtn" class="ghost sync" data-act="settings">Non synchronisé</button>
      <button type="button" id="wakeBtn" class="ghost" aria-pressed="false">Garder l'écran allumé</button>
      <button type="button" id="settingsBtn" class="icon-btn" data-act="settings" aria-label="Réglages"></button>
      <div class="clock" id="clock">--:--</div>
    </div>
  </header>

  <form id="noteForm" class="capture" autocomplete="off">
    <label for="noteInput" class="cap-label">Noter</label>
    <textarea id="noteInput" rows="1" placeholder="Une tâche, une idée, un pense-bête… Tu trieras plus tard."></textarea>
    <button type="submit" id="noteBtn" class="primary">Noter</button>
  </form>

  <nav class="controls" aria-label="Affichage">
    <div class="tabs" role="tablist" aria-label="Vue">

<script>
(function () {
  "use strict";

  const STORE = "cockpit.v3", STORE_V2 = "cockpit.v2", STORE_V1 = "cockpit.v1";

  const ICONS = {
    gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',

    note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/></svg>',

    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>',
    check: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.2 6.4l2.4 2.4 5.2-5.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };
  const $ = (s) => document.querySelector(s);

  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    if (props) {
      for (const k of Object.keys(props)) {
        const v = props[k];
        if (v == null || v === false) continue;
        if (k === "class") el.className = v;
        else if (k === "text") el.textContent = v;
        else el.setAttribute(k, v === true ? "" : String(v));
      }
    }
    for (const kid of kids.flat(3)) {
      if (kid == null || kid === false) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  function icon(name) { const s = h("span", { class: "ico", "aria-hidden": "true" }); s.innerHTML = ICONS[name]; return s; }

  /* Dates */
  const pad = (n) => String(n).padStart(2, "0");
  const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const addDays = (d, n) => { const x = startOfDay(d); x.setDate(x.getDate() + n); return x; };
  const mondayOf = (d) => addDays(d, -((d.getDay() + 6) % 7));
  const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const ISO_RE = /^\d{4}-\d{2}-\d{2}$/;
  const validIso = (s) => (typeof s === "string" && ISO_RE.test(s) ? s : null);
  const fromIso = (s) => { const p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  const dayDiff = (a, b) => Math.round((startOfDay(a) - startOfDay(b)) / 86400000);
  const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
  const mins = (t) => { const p = t.split(":").map(Number); return p[0] * 60 + p[1]; };
  const dur = (m) => { m = Math.max(0, Math.round(m)); const hh = Math.floor(m / 60), mm = m % 60; return hh ? hh + " h " + pad(mm) : mm + " min"; };
  const durLabel = (m) => (m >= 60 ? (m % 60 ? Math.floor(m / 60) + " h " + pad(m % 60) : m / 60 + " h") : m + " min");
  const nowIso = () => new Date().toISOString();
  const uid = () => (window.crypto && typeof crypto.randomUUID === "function") ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const plural = (n, one, many) => n + " " + (n > 1 ? many : one);
  function isoWeek(d) {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y0) / 86400000 + 1) / 7);
  }
  const fLong = new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  const fWd = new Intl.DateTimeFormat("fr-FR", { weekday: "long" });
  const fWdS = new Intl.DateTimeFormat("fr-FR", { weekday: "short" });
  const fDM = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short" });
  const fDMY = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "long", year: "numeric" });
  function ago(isoStr) {
    const t = Date.parse(isoStr);
    if (isNaN(t)) return "";
    const m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return "à l'instant";
    if (m < 60) return "il y a " + m + " min";
    const hh = Math.round(m / 60);
    if (hh < 24) return "il y a " + hh + " h";
    const dd = Math.round(hh / 24);
    return dd === 1 ? "hier" : "il y a " + dd + " j";
  }

  let today = startOfDay(new Date());
  let monday = mondayOf(today);


  /* Données */
  function mkTask(p) { return { id: uid(), title: p.title, d: p.d, th: p.th || null, due: p.due || null, dur: p.dur || null, obj: p.obj || null, done: !!p.done, doneAt: p.done ? nowIso() : null, ex: !!p.ex, created: nowIso(), upd: nowIso() }; }
  function mkNote(text, ex) { return { id: uid(), text: text, ex: !!ex, created: nowIso(), upd: nowIso() }; }
  function mkIdea(p) { return { id: uid(), text: p.text, d: p.d, th: p.th || null, ex: !!p.ex, created: nowIso(), upd: nowIso() }; }
  function mkObj(p) { return { id: uid(), title: p.title, d: p.d, th: p.th || null, due: p.due || null, ex: !!p.ex, created: nowIso(), upd: nowIso() }; }
  function mkTheme(d, label) { return { id: uid(), d: d, label: label, created: nowIso(), upd: nowIso() }; }
  function defaultThemesFor(domains) {
    const out = [];
    domains.forEach((d) => (DEFAULT_THEMES[d.id] || []).forEach((label) => out.push(mkTheme(d.id, label))));
    return out;
  }
  function defaults() {
    const doms = DEFAULT_DOMAINS.map((d) => Object.assign({}, d));
    return { v: 3, domains: doms, themes: defaultThemesFor(doms), notes: [], ideas: [], objectives: [], tasks: [], settings: { theme: "light" } };
  }

  function seedExamples(s) {
    const rel = (n) => iso(addDays(today, n));
    const th = (d, label) => { const t = s.themes.find((x) => x.d === d && x.label === label); return t ? t.id : null; };
    const has = (d) => s.domains.some((x) => x.id === d);
    if (has("junior")) {
      const part = th("junior", "Partenariats"), pros = th("junior", "Prospection"), com = th("junior", "Communication");
      const o1 = mkObj({ title: "Signer 2 études avec le partenaire", d: "junior", th: part, due: rel(120), ex: true });
      const o2 = mkObj({ title: "Publier 12 posts LinkedIn d'ici mars", d: "junior", th: com, due: rel(100), ex: true });
      const o3 = mkObj({ title: "Décrocher 8 rendez-vous ce mois-ci", d: "junior", th: pros, due: rel(30), ex: true });
      s.objectives.push(o1, o2, o3);
      s.tasks.push(
        mkTask({ title: "Envoyer la convention signée", d: "junior", th: part, due: rel(-5), obj: o1.id, done: true, ex: true }),
        mkTask({ title: "Relancer le partenaire pour obtenir des contacts", d: "junior", th: part, due: rel(-2), obj: o1.id, dur: 15, ex: true }),
        mkTask({ title: "Préparer l'atelier avec le partenaire", d: "junior", th: part, due: rel(2), obj: o1.id, dur: 60, ex: true }),
        mkTask({ title: "Post de rentrée", d: "junior", th: com, due: rel(-10), obj: o2.id, done: true, ex: true }),
        mkTask({ title: "Post sur une étude passée", d: "junior", th: com, due: rel(3), obj: o2.id, dur: 60, ex: true }),
        mkTask({ title: "Post recrutement", d: "junior", th: com, due: rel(7), obj: o2.id, dur: 45, ex: true }),
        mkTask({ title: "Refaire la bannière LinkedIn", d: "junior", th: com, ex: true }),
        mkTask({ title: "Relancer les prospects du salon", d: "junior", th: pros, due: rel(1), obj: o3.id, dur: 60, ex: true }),
        mkTask({ title: "Appeler 5 entreprises de la liste", d: "junior", th: pros, due: rel(4), obj: o3.id, dur: 60, ex: true }),
        mkTask({ title: "Envoyer le compte rendu mensuel à l'école", d: "junior", due: rel(0), dur: 30, ex: true })
      );
      s.ideas.push(
        mkIdea({ text: "Proposer des articles techniques écrits par des élèves", d: "junior", th: part, ex: true }),
        mkIdea({ text: "Série « une étude, un post »", d: "junior", th: com, ex: true })
      );
    }
    if (has("cours")) {
      const o = mkObj({ title: "Réviser les matières avant les partiels", d: "cours", due: rel(45), ex: true });
      s.objectives.push(o);
      s.tasks.push(
        mkTask({ title: "Faire le planning de révision", d: "cours", due: rel(0), obj: o.id, dur: 30, ex: true }),
        mkTask({ title: "Réviser Energy economics", d: "cours", th: th("cours", "Energy economics"), due: rel(5), obj: o.id, dur: 120, ex: true }),
        mkTask({ title: "Réviser Computer science", d: "cours", th: th("cours", "Computer science"), due: rel(8), obj: o.id, dur: 120, ex: true })
      );
    }
    if (has("stage")) {
      const mob = th("stage", "Mobilité 3A");
      const o = mkObj({ title: "Préparer le dossier de mobilité 3A", d: "stage", th: mob, due: rel(60), ex: true });
      s.objectives.push(o);
      s.tasks.push(
        mkTask({ title: "Lister des universités en Scandinavie", d: "stage", th: mob, due: rel(9), obj: o.id, dur: 60, ex: true }),
        mkTask({ title: "Mettre le CV à jour", d: "stage", th: th("stage", "Stage 2A"), due: rel(3), dur: 60, ex: true })
      );
    }
    if (has("perso")) {
      s.tasks.push(
        mkTask({ title: "Faire les courses", d: "perso", due: rel(1), ex: true }),
        mkTask({ title: "Payer le loyer", d: "perso", due: rel(7), dur: 15, ex: true })
      );
      s.ideas.push(mkIdea({ text: "Tester un club de sport près de l'école", d: "perso", ex: true }));
    }
    s.notes.push(
      mkNote("Idée pour le bureau : un point mensuel sur les relances", true),
      mkNote("relancer le partenaire lundi, préparer la réunion du pôle jeudi", true),
      mkNote("Appeler la banque demain", true)
    );
  }
  function removeExamplesFrom(s) {
    const exObj = new Set(s.objectives.filter((o) => o.ex).map((o) => o.id));
    s.objectives = s.objectives.filter((o) => !o.ex);
    s.tasks = s.tasks.filter((t) => !t.ex);
    s.tasks.forEach((t) => { if (exObj.has(t.obj)) { t.obj = null; t.upd = nowIso(); } });
    s.notes = s.notes.filter((n) => !n.ex);
    s.ideas = s.ideas.filter((i) => !i.ex);
  }

  const ordOf = (x) => (typeof x.o === "number" && isFinite(x.o) ? x.o : undefined);
  /* Temps passé : une ligne par jour travaillé { d: date, m: minutes, s: source }.
     Depuis le 26/11, seul "m" (ajouté à la main) est créé. "p" (durée prévue comptée en cochant) et "q" (réponse à une question
     en cochant) viennent de la version e7db195 : gardés à la lecture, retirés si la tâche est remise à faire. */
  const LOG_SRC = { p: "durée prévue, en cochant", q: "en cochant", m: "ajouté à la main", f: "focus, ajouté par toi" };
  const LOG_AT_CHECK = { p: true, q: true };   // retirées si la tâche est remise à faire
  const logOf = (a) => {
    if (!Array.isArray(a)) return undefined;
    const out = a.filter((x) => x && validIso(x.d) && Number.isInteger(x.m) && x.m > 0 && x.m <= 1440 && LOG_SRC[x.s])
      .slice(0, 2000).map((x) => ({ d: x.d, m: x.m, s: x.s }));
    return out.length ? out : undefined;
  };
  const slotOf = (x) => (x && validIso(x.d) && Number.isInteger(x.s) && Number.isInteger(x.m) && x.s >= 0 && x.m >= 5 && x.s + x.m <= 1440
    ? { d: x.d, s: x.s, m: x.m } : undefined);   // créneau dans l'agenda : jour, début et durée en minutes
  const calsOf = (v) => {
    if (!Array.isArray(v)) return undefined;
    const out = [...new Set(v.filter((x) => typeof x === "string" && x.trim()).map((x) => x.trim().slice(0, 80)))].slice(0, 20);
    return out.length ? out : undefined;
  };
  function sanitize(d) {
    const s = defaults();
    const str = (v, n) => (typeof v === "string" ? v : "").slice(0, n);
    if (Array.isArray(d.domains)) {
      const doms = d.domains.filter((x) => x && typeof x.id === "string" && x.id && typeof x.label === "string")
        .map((x) => {
          const o = { id: x.id.slice(0, 64), label: x.label.slice(0, 40) || "Domaine", color: COLORS.includes(x.color) ? x.color : "slate", o: ordOf(x) };
          const cals = calsOf(x.cals);   // calendriers de l'iPhone rangés dans ce domaine (absent si aucun)
          if (cals) o.cals = cals;
          return o;
        });
      if (doms.length) s.domains = doms;
    }
    const domIds = new Set(s.domains.map((x) => x.id));
    const fixD = (v) => (domIds.has(v) ? v : s.domains[0].id);
    const base = (x) => ({ id: str(x.id, 64) || uid(), ex: !!x.ex, created: str(x.created, 40) || nowIso(), upd: str(x.upd, 40) || nowIso() });
    s.themes = (Array.isArray(d.themes) ? d.themes : []).filter((x) => x && typeof x.id === "string" && x.id && domIds.has(x.d) && str(x.label, 60).trim())
      .map((x) => ({ id: x.id.slice(0, 64), d: x.d, label: str(x.label, 60), created: str(x.created, 40) || nowIso(), upd: str(x.upd, 40) || nowIso(), o: ordOf(x) }));
    const thDom = new Map(s.themes.map((t) => [t.id, t.d]));
    const fixTh = (th, dd) => (th && thDom.get(th) === dd ? th : null);
    s.notes = (Array.isArray(d.notes) ? d.notes : []).filter((x) => x && str(x.text, 4000).trim())
      .map((x) => Object.assign(base(x), { text: str(x.text, 4000) }));
    s.ideas = (Array.isArray(d.ideas) ? d.ideas : []).filter((x) => x && str(x.text, 2000).trim())
      .map((x) => { const dd = fixD(x.d); return Object.assign(base(x), { text: str(x.text, 2000), d: dd, th: fixTh(x.th, dd) }); });
    s.objectives = (Array.isArray(d.objectives) ? d.objectives : []).filter((x) => x && str(x.title, 300).trim())
      .map((x) => { const dd = fixD(x.d); return Object.assign(base(x), { title: str(x.title, 300), d: dd, th: fixTh(x.th, dd), due: validIso(x.due) }); });
    const objIds = new Set(s.objectives.map((o) => o.id));
    s.tasks = (Array.isArray(d.tasks) ? d.tasks : []).filter((x) => x && str(x.title, 300).trim())
      .map((x) => {
        const dd = fixD(x.d);
        return Object.assign(base(x), {
          title: str(x.title, 300), d: dd, th: fixTh(x.th, dd), due: validIso(x.due),
          dur: (typeof x.dur === "number" && x.dur > 0 && x.dur <= 1440) ? x.dur : null,
          obj: objIds.has(x.obj) ? x.obj : null, done: !!x.done, doneAt: x.done ? (str(x.doneAt, 40) || null) : null,
          o: ordOf(x), notes: str(x.notes, 20000) || undefined,   // absents si vides : rien ne change pour les anciennes tâches
          log: logOf(x.log), slot: slotOf(x.slot)
        });
      });
    const thm = d.settings && d.settings.theme;
    s.settings.theme = ["light", "dark", "auto"].includes(thm) ? thm : "light";
    return s;
  }

    let notesTimer = null, notesSaved = false;
    const saveNotes = () => {
      clearTimeout(notesTimer); notesTimer = null;
      if (!task || !S.tasks.includes(task)) return;

      if ((task.notes || "") === v) return;
      setNotes(task, v); task.upd = nowIso(); save(); notesSaved = true;
    };
    if (task) {
      notesIn.addEventListener("input", () => { clearTimeout(notesTimer); notesTimer = setTimeout(saveNotes, 700); });

    }

    /* Temps passé : pour une tâche existante, enregistré tout de suite (comme les notes) */
    let timeChanged = false, logDay = "today";
    const timeBox = h("div", { class: "time-box" });
    const touchTime = () => { if (task.log && !task.log.length) delete task.log; task.upd = nowIso(); save(); timeChanged = true; drawTime(); };
    function drawTime() {
      timeBox.textContent = "";
      const sp = spent(task);
      timeBox.append(h("p", { class: "time-total" + (sp ? "" : " none"), text: sp ? durLabel(sp) + " en tout" : "Rien de compté pour l'instant." }));
      if (sp) {
        const rows = task.log.map((x, i) => [x, i]).sort((a, b) => (a[0].d < b[0].d ? 1 : a[0].d > b[0].d ? -1 : b[1] - a[1]));
        timeBox.append(h("ul", { class: "time-log" }, rows.map(([x]) => {
          const lbl = logDayLabel(x.d);
          const del = h("button", { type: "button", class: "tl-x", "aria-label": "Retirer " + durLabel(x.m) + " (" + lbl + ")", title: "Retirer" }, "×");
          del.addEventListener("click", () => { const k = task.log.indexOf(x); if (k >= 0) task.log.splice(k, 1); touchTime(); });
          return h("li", null, h("span", { class: "tl-d" }, lbl, " ", h("span", { class: "tl-s", text: "· " + LOG_SRC[x.s] })), h("span", { class: "tl-m", text: durLabel(x.m) }), del);
        })));

      const add = h("div", { class: "time-add" }, [15, 30, 60, 120].map((m) => {

    saveBtn.addEventListener("click", () => {
      const title = titleIn.value.trim();

      const sd = validIso(slotDate.value), tm = /^\d{2}:\d{2}/.test(slotTime.value) ? mins(slotTime.value.slice(0, 5)) : null;
      if (!sd !== (tm === null)) { slotErr.hidden = false; return; }

      if (sd) { const m0 = (oldSlot && oldSlot.m) || vals.dur || 60; slot = { d: sd, s: tm, m: Math.max(5, Math.min(m0, 1440 - tm)) }; if (slot.s + slot.m > 1440) slot = null; }

        setNotes(task, notes);

      }
      else { const t = mkTask(vals); setNotes(t, notes); if (slot) t.slot = slot; t.o = endKey(vals.due, t.id); S.tasks.push(t); markFresh(t.id); }

    });

    if (task && !task.done) {   // garde les modifications de la fiche, puis passe en mode focus
      focusGo = h("button", { type: "button", class: "focus-go" }, icon("focus"), "Mode focus");

    if (task) actions.push(h("span", { class: "spacer" }), dangerButton("Supprimer", delLabel, () => {

      task ? field("Temps passé", [timeBox, h("p", { class: "hint", text: "Seul le temps que tu mets ici compte (cocher la tâche n'ajoute rien). Enregistré tout de suite, jour par jour si la tâche s'étale." })]) : null,

      field("Objectif", [objSel], "f-obj"),

      field("Dans l'agenda (facultatif)", [h("div", { class: "slot-row" }, slotDate, slotTime, unslot), slotErr, h("p", { class: "hint", text: "Quand tu comptes la faire. Tu peux aussi la glisser sur la grille de l'onglet Agenda." })]),

    ], actions);
    if (task) { sheetCloser = () => { saveNotes(); if (notesSaved || timeChanged) renderAll(); }; sheetFlush = saveNotes; }
    if (!task && !preset.title) setTimeout(() => titleIn.focus(), 60);
  }

  function deleteDomain(id) {
    const rest = S.domains.filter((d) => d.id !== id);
    if (!rest.length) return null;
    const target = rest.find((d) => d.id === "perso") || rest[0];
    const mv = (x) => { if (x.d === id) { x.d = target.id; x.th = null; x.upd = nowIso(); } };
    S.tasks.forEach(mv); S.ideas.forEach(mv); S.objectives.forEach(mv);
    S.themes = S.themes.filter((t) => t.d !== id);
    S.domains = rest;
    if (filter === id) filter = "tout";
    if (themeSel && (themeSel.d === id || (themeSel.id && !theme(themeSel.id)))) themeSel = null;
    save();
    return target;
  }

  /* Calendriers de l'iPhone : un raccourci y dépose les événements des calendriers choisis
     (début, fin, journée entière, calendrier, lieu, titre). Il s'identifie par une clé créée ici,
     affichée une seule fois (le serveur n'en garde que l'empreinte) ; elle ne permet que de déposer. */
  const AG_URL = SB_URL + "/rest/v1/rpc/agenda_deposer?apikey=" + SB_KEY;
  let agKeyShown = null;   // clé tout juste créée : visible jusqu'à la fermeture de l'appli, jamais enregistrée
  const agendaRead = () => api("POST", "/rest/v1/rpc/agenda_lire", {});
  function agendaStateText(info) {
    if (!info || !info.recu_le) return "Aucun envoi reçu pour l'instant.";
    const b = info.bilan || {}, cals = b.calendriers || {};
    const parts = Object.keys(cals).sort().map((c) => (c || "Sans nom") + " (" + cals[c] + ")");
    const n = Array.isArray(info.evenements) ? info.evenements.length : 0;
    return "Dernier envoi reçu " + ago(info.recu_le) + (parts.length ? " : " + parts.join(", ") : "") +
      (b.illisibles ? ", " + plural(b.illisibles, "ligne illisible", "lignes illisibles") : "") + ". " + plural(n, "événement gardé", "événements gardés") + ".";
  }
  function agendaErrText(e) {
    if (e instanceof TypeError) return "Pas de connexion : état indisponible pour l'instant.";
    if (e instanceof AuthError) return "Reconnecte-toi pour voir l'état.";
    if (/PGRST202|agenda_lire/.test((e && e.message) || "")) return "Le serveur n'est pas encore prêt : la nouvelle version de supabase-schema.sql doit être collée dans Supabase.";
    return "Lecture impossible : " + ((e && e.message) || "erreur inconnue");
  }

  function renderChrono() {

      const from = Math.max(now, D0);

      all.forEach((e) => { const s = Math.max(mins(e.s), from), en = Math.min(mins(e.e), D1); if (en > s) busyM += en - s; });
      free = "Libre d'ici 22 h : " + dur(D1 - from - busyM);

  });

  /* Mode focus (26/11) : aucun temps affiché pendant ; à la fin, le temps passé, comme repère.
     Rien n'est compté d'office : Martin choisit d'ajouter ce temps à la tâche, ou non.
     L'état vit sur l'appareil (pas synchronisé) : il survit à la fermeture de l'appli. */
  const FOCUS_KEY = "cockpit.focus", FDAY_KEY = "cockpit.focusday";
  const readF = () => { const f = readJson(FOCUS_KEY); return f && typeof f.id === "string" && typeof f.t0 === "number" ? f : null; };
  const writeF = (f) => writeJson(FOCUS_KEY, f);
  const elapsedF = (f) => Math.max(0, (f.acc || 0) + (f.run ? Date.now() - f.t0 : 0));
  const fMs = (ms) => { const m = Math.round(ms / 60000); return m >= 1 ? durLabel(m) : "moins d'une minute"; };
  const focusEl = h("div", { id: "focus", class: "focus", hidden: true, role: "dialog", "aria-modal": "true", "aria-labelledby": "focusTitle" });
  const focusPill = h("button", { type: "button", id: "focusPill", class: "focus-pill", hidden: true });
  document.body.append(focusEl, focusPill);
  focusPill.addEventListener("click", openFocus);
  let focusNotesTimer = null;

  function startFocus(id) {
    const t = S.tasks.find((x) => x.id === id);
    if (!t) return;
    const cur = readF();
    if (cur && cur.id !== id) { openFocus(); toast("Un focus est déjà en cours : termine-le d'abord."); return; }
    if (!cur) writeF({ id: t.id, title: t.title, t0: Date.now(), acc: 0, run: true });
    openFocus();
  }
  function showFocus() { focusEl.hidden = false; focusPill.hidden = true; document.body.classList.add("focus-open"); }
  function openFocus() {
    const f = readF();
    if (!f) return;
    if (!S.tasks.some((x) => x.id === f.id)) { endFocus(); return; }   // tâche supprimée entre-temps
    drawFocus(f);
    showFocus();
  }
  function hideFocus() { focusEl.hidden = true; focusEl.textContent = ""; document.body.classList.remove("focus-open"); paintPill(); }
  function paintPill() {
    const f = readF();
    focusPill.hidden = !f || !focusEl.hidden;
    if (!f) return;
    focusPill.className = "focus-pill" + (f.run ? "" : " paused");
    focusPill.textContent = "";
    focusPill.append(h("span", { class: "pulse" }), h("span", { class: "t", text: (f.run ? "Focus : " : "Focus en pause : ") + f.title }));
    focusPill.setAttribute("aria-label", "Revenir au focus : " + f.title);
  }
  function flushFocusNotes() {
    clearTimeout(focusNotesTimer); focusNotesTimer = null;
    const ta = document.getElementById("focusNotes"), f = readF();
    if (!ta || !f) return;
    const t = S.tasks.find((x) => x.id === f.id);
    if (!t) return;
    const v = ta.value.slice(0, 20000);
    if ((t.notes || "") === v) return;
    if (v) t.notes = v; else delete t.notes;
    t.upd = nowIso(); save();
  }
  function drawFocus(f) {
    const t = S.tasks.find((x) => x.id === f.id);
    if (!t) { endFocus(); return; }
    focusEl.textContent = "";
    focusEl.classList.toggle("paused", !f.run);
    const notes = h("textarea", { id: "focusNotes", class: "in", placeholder: "Ce que tu fais, ce qui se dit, ce qui reste à faire…" });
    notes.value = t.notes || "";
    notes.addEventListener("input", () => { clearTimeout(focusNotesTimer); focusNotesTimer = setTimeout(flushFocusNotes, 700); });
    notes.addEventListener("blur", flushFocusNotes);
    const minB = h("button", { type: "button", class: "ghost" }, "Réduire");
    minB.addEventListener("click", () => { flushFocusNotes(); hideFocus(); renderAll(); });
    const endB = h("button", { type: "button", class: "primary" }, "Terminer");
    endB.addEventListener("click", endFocus);
    const pauseB = h("button", { type: "button", class: "act" }, f.run ? "Pause" : "Reprendre");
    pauseB.addEventListener("click", () => {
      flushFocusNotes();
      const g = readF();
      if (!g) return;
      if (g.run) { g.acc = elapsedF(g); g.run = false; } else { g.t0 = Date.now(); g.run = true; }
      writeF(g);
      drawFocus(g);
    });
    focusEl.append(h("div", { class: "focus-in" },
      h("div", { class: "focus-top" },
        h("span", { class: "focus-state" }, h("span", { class: "pulse" }), f.run ? "Focus en cours" : "En pause"),
        h("span", { class: "dchip k-" + dom(t.d).color, text: scopeLabel(t) }),
        minB),
      h("h2", { class: "focus-title", id: "focusTitle", text: t.title }),
      h("div", { class: "focus-notes" },
        h("label", { class: "lab", for: "focusNotes", text: "Notes" }),
        notes,
        h("p", { class: "hint", text: "Enregistrées au fur et à mesure, dans la tâche. Le temps n'est pas affiché : tu le verras en terminant." })),
      h("div", { class: "focus-actions" }, endB, pauseB)));
  }
  function endFocus() {
    flushFocusNotes();
    const f = readF();
    if (!f) { hideFocus(); return; }
    const ms = elapsedF(f);
    writeF(null);
    let day = readJson(FDAY_KEY);   // repère du jour, sur cet appareil seulement
    if (!day || day.d !== iso(today) || typeof day.ms !== "number") day = { d: iso(today), ms: 0 };
    day.ms += ms;
    writeJson(FDAY_KEY, day);
    drawEnd(f, ms, day.ms);
    showFocus();
  }
  function drawEnd(f, ms, dayMs) {
    const m = Math.min(1440, Math.round(ms / 60000));
    const t = S.tasks.find((x) => x.id === f.id);
    focusEl.textContent = "";
    focusEl.classList.remove("paused");
    const acts = h("div", { class: "focus-actions" });
    if (t && m >= 1) {
      const addB = h("button", { type: "button", class: "act" }, "Ajouter " + durLabel(m) + " au temps de la tâche");
      addB.addEventListener("click", () => {
        const tt = S.tasks.find((x) => x.id === f.id);
        if (!tt || addB.disabled) return;
        addLog(tt, iso(today), m, "f"); tt.upd = nowIso(); save();
        addB.disabled = true; addB.textContent = "✓ " + durLabel(m) + " ajouté" + (m === 60 ? "e" : "es") + " à la tâche";
      });
      acts.append(addB);
    }
    if (t && !t.done) {
      const doneB = h("button", { type: "button", class: "act" }, "Marquer la tâche comme faite");
      doneB.addEventListener("click", () => {
        const tt = S.tasks.find((x) => x.id === f.id);
        if (!tt || doneB.disabled) return;
        if (!tt.done) { tt.done = true; tt.doneAt = nowIso(); tt.upd = nowIso(); save(); }
        doneB.disabled = true; doneB.textContent = "✓ Tâche faite";
      });
      acts.append(doneB);
    }
    const closeB = h("button", { type: "button", class: "primary" }, "Fermer");
    closeB.addEventListener("click", () => { hideFocus(); renderAll(); });
    acts.append(closeB);
    focusEl.append(h("div", { class: "focus-in focus-end" },
      h("span", { class: "focus-state", text: "Focus terminé" }),
      h("p", { class: "focus-lead", text: "Tu as passé" }),
      h("p", { class: "focus-big", id: "focusTitle", text: fMs(ms) }),
      h("p", { class: "focus-on", text: "sur « " + (t ? t.title : f.title) + " »" }),
      ms > 3 * 3600000 ? h("p", { class: "hint", text: "C'est long : le focus a peut-être tourné sans toi. Rien n'est compté tant que tu ne l'ajoutes pas." }) : null,
      h("p", { class: "hint", text: "Rien n'est compté d'office : c'est toi qui choisis d'ajouter ce temps à la tâche." }),
      acts,
      h("p", { class: "hint", text: "Focus aujourd'hui, sur cet appareil : " + fMs(dayMs) })));
    setTimeout(() => closeB.focus({ preventScroll: true }), 60);
  }
  document.addEventListener("keydown", (ev) => {
    if (ev.key !== "Escape" || focusEl.hidden || sheet.open) return;
    ev.preventDefault();
    flushFocusNotes();
    hideFocus();
    renderAll();
  });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushFocusNotes(); });

  $("#settingsBtn").append(icon("gear"));
  applyTheme();
  renderAll();
  if (readF()) openFocus();   // un focus était en cours quand l'appli a été fermée
  tick();
  setInterval(tick, 20000);
  if (auth && sync) syncNow();
  extRefresh(true);   // cours et réunions envoyés par l'iPhone
  setInterval(() => { if (document.visibilityState === "visible") extRefresh(false); }, 60000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") extRefresh(false); });
})();
</script>
</body>
</html>
